name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tìm project (giải nén WeatherM3.zip nếu có)
        run: |
          set -e
          if [ -f WeatherM3.zip ]; then
            rm -rf _proj && mkdir _proj
            unzip -q WeatherM3.zip -d _proj
          fi
          S=$(find . -maxdepth 4 -name settings.gradle.kts -not -path './_proj/*/.github/*' | head -1)
          if [ -z "$S" ]; then echo "Không thấy settings.gradle.kts"; exit 1; fi
          echo "PROJ=$(dirname "$S")" >> "$GITHUB_ENV"
          echo "Project nằm ở: $(dirname "$S")"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: ${{ env.PROJ }}
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WeatherM3-debug-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
